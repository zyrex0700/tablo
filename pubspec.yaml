name: tablo_rebuild
description: Rebuild starter for tablo.ir using Flutter Web + GetX.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  google_fonts: ^6.2.1
  http: ^1.2.2
  latlong2: ^0.9.1
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.3.6
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  fonts:
    - family: IRANYekan
      fonts:
        - asset: assets/fonts/iranyekan/IRANYekanThinRd.ttf
          weight: 100
        - asset: assets/fonts/iranyekan/IRANYekanLightRd.ttf
          weight: 300
        - asset: assets/fonts/iranyekan/IRANYekanRegularRd.ttf
          weight: 400
        - asset: assets/fonts/iranyekan/IRANYekanMediumRd.ttf
          weight: 500
        - asset: assets/fonts/iranyekan/IRANYekanBoldRd.ttf
          weight: 700
        - asset: assets/fonts/iranyekan/IRANYekanExtraBoldRd.ttf
          weight: 800
        - asset: assets/fonts/iranyekan/IRANYekanBlackRd.ttf
          weight: 900
